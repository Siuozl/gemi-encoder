<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemi Encoder</title>
<style>
  :root { --bg:#f4f5f8; --card:#fff; --ink:#1d2030; --mute:#6b7080; --line:#dde0e8; --accent:#ff6680; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14151b; --card:#1e2029; --ink:#e8e9ef; --mute:#9095a6; --line:#2e3140; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system, system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:32px 16px 48px; display:flex; flex-direction:column; gap:14px; }
  h1 { font-size:24px; margin:0; text-align:center; }
  #drop { background:var(--card); border:2px dashed var(--line); border-radius:12px; padding:28px 12px; text-align:center; cursor:pointer; color:var(--mute); }
  #drop.over { border-color:var(--accent); color:var(--accent); }
  #drop img { max-width:100%; max-height:120px; display:block; margin:0 auto; }
  .size { display:flex; gap:10px; justify-content:center; align-items:center; color:var(--mute); }
  input[type=number] { width:70px; padding:6px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); text-align:center; }
  textarea { width:100%; height:140px; font:12px/1.4 ui-monospace, Menlo, monospace; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); resize:vertical; word-break:break-all; }
  .btns { display:flex; gap:8px; justify-content:center; }
  button { border:0; border-radius:8px; padding:9px 18px; font-weight:600; cursor:pointer; background:var(--accent); color:#fff; }
  button.ghost { background:var(--card); color:var(--ink); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  .stage { background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; aspect-ratio:4/3; }
  .part { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:8px; }
  .part .head { display:flex; align-items:center; gap:10px; font-weight:600; }
  .part .head span { color:var(--mute); font-weight:500; font-variant-numeric:tabular-nums; }
  .part .head button { margin-left:auto; padding:6px 14px; }
  .part textarea { height:60px; }
  #parts { display:flex; flex-direction:column; gap:10px; }
  canvas { width:100%; height:100%; display:block; image-rendering:pixelated; }
</style>
</head>
<body>
<main>
  <h1>Gemi Encoder</h1>
  <div id="drop">Drop or choose an image</div>
  <input type="file" id="file" accept="image/*" hidden>
  <div class="size"><input type="number" id="maxW" value="48" min="1" max="480" title="Width"> × <input type="number" id="maxH" value="36" min="1" max="360" title="Height"></div>
  <div class="size">Slices <input type="number" id="cols" value="1" min="1" max="20" title="Columns"> × <input type="number" id="rows" value="1" min="1" max="20" title="Rows"></div>
  <div id="parts"></div>
  <div class="btns"><button id="list" disabled>Export list</button><button class="ghost" id="save" disabled>Download all</button></div>
  <div class="stage"><canvas id="stage" width="480" height="360"></canvas></div>
</main>

<script>
const $ = id => document.getElementById(id);
const MAX_ITEMS = 20000;
let img = null, parts = [];

const drop = $('drop');
drop.onclick = () => $('file').click();
$('file').onchange = e => e.target.files[0] && load(e.target.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); e.dataTransfer.files[0] && load(e.dataTransfer.files[0]); };
window.addEventListener('paste', e => {
  const f = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
  if (f) load(f.getAsFile());
});
for (const id of ['maxW', 'maxH', 'cols', 'rows']) $(id).addEventListener('input', convert);

function load(file) {
  const im = new Image();
  im.onload = () => { img = im; drop.replaceChildren(im.cloneNode()); convert(); };
  im.src = URL.createObjectURL(file);
}

// shrink in halving steps (proper averaging), then clamp lone outlier pixels to their neighbours' range
function sample(img, w, h) {
  let src = img, sw = img.width, sh = img.height;
  while (sw / 2 >= w && sh / 2 >= h) {
    const s = document.createElement('canvas'); s.width = Math.round(sw / 2); s.height = Math.round(sh / 2);
    const sc = s.getContext('2d'); sc.imageSmoothingQuality = 'high'; sc.drawImage(src, 0, 0, s.width, s.height);
    src = s; sw = s.width; sh = s.height;
  }
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data, out = new Uint8ClampedArray(d);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    for (let ch = 0; ch < 4; ch++) {
      let lo = 255, hi = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const xx = x + dx, yy = y + dy;
        if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
        const v = d[(yy * w + xx) * 4 + ch]; if (v < lo) lo = v; if (v > hi) hi = v; n++;
      }
      if (n) out[i + ch] = Math.min(Math.max(d[i + ch], lo), hi);
    }
  }
  return out;
}

function rgbToScratch(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return [h / 3.6, max ? d / max * 100 : 0, max * 100];
}

function convert() {
  if (!img) return;
  const maxW = +$('maxW').value || 1, maxH = +$('maxH').value || 1;
  const scale = Math.min(1, maxW / img.width, maxH / img.height);
  const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));

  const data = sample(img, w, h);

  const ox = Math.floor(w / 2), oy = Math.floor(h / 2);
  let cols = Math.min(Math.max(+$('cols').value || 1, 1), w), rows = Math.min(Math.max(+$('rows').value || 1, 1), h);
  const slice = () => {
    parts = [];
    let most = 0;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const x0 = Math.floor(c * w / cols), x1 = Math.floor((c + 1) * w / cols);
      const y0 = Math.floor(r * h / rows), y1 = Math.floor((r + 1) * h / rows);
      const lx = Math.floor((x1 - x0) / 2), ly = Math.floor((y1 - y0) / 2);
      const vals = [];
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
        const i = (y * w + x) * 4;
        if (data[i + 3] === 0) continue;
        const [hue, sat, bri] = rgbToScratch(data[i], data[i + 1], data[i + 2]);
        const t = (1 - data[i + 3] / 255) * 100;
        vals.push(x - x0 - lx, ly - (y - y0), Math.round(hue), Math.round(sat), Math.round(bri), Math.round(t));
      }
      most = Math.max(most, vals.length);
      if (vals.length) parts.push({ x: x0 + lx - ox, y: oy - y0 - ly, str: vals.join('/') + '/' });
    }
    return most;
  };
  // no part may go over 20,000 list items: add slices along the longer side until each fits
  while (slice() > MAX_ITEMS && (cols < w || rows < h)) {
    if ((w / cols >= h / rows && cols < w) || rows >= h) cols++; else rows++;
  }
  $('cols').value = cols; $('rows').value = rows;
  showParts();
  $('save').disabled = $('list').disabled = !parts.length;
  preview(Math.max(1, Math.floor(Math.min(480 / w, 360 / h))));
}

function showParts() {
  const box = $('parts'); box.replaceChildren();
  parts.forEach((p, n) => {
    const el = document.createElement('div'); el.className = 'part';
    el.innerHTML = `<div class="head">Part ${n + 1}<span>x: ${p.x}</span><span>y: ${p.y}</span><button>Copy</button></div><textarea readonly></textarea>`;
    el.querySelector('textarea').value = p.str;
    const btn = el.querySelector('button');
    btn.onclick = async () => {
      await navigator.clipboard.writeText(p.str);
      btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy', 1200);
    };
    box.append(el);
  });
}

function hsvToRgb(h, s, v) {
  h = ((h % 100) + 100) % 100 * 3.6; s /= 100; v /= 100;
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  const [r, g, b] = h < 60 ? [c,x,0] : h < 120 ? [x,c,0] : h < 180 ? [0,c,x] : h < 240 ? [0,x,c] : h < 300 ? [x,0,c] : [c,0,x];
  return `${Math.round((r+m)*255)},${Math.round((g+m)*255)},${Math.round((b+m)*255)}`;
}

function preview(size) {
  const ctx = $('stage').getContext('2d');
  ctx.clearRect(0, 0, 480, 360);
  for (const p of parts) {
    const v = p.str.split('/');
    for (let i = 0; i + 5 < v.length; i += 6) {
      ctx.fillStyle = `rgba(${hsvToRgb(+v[i+2], +v[i+3], +v[i+4])},${1 - v[i+5] / 100})`;
      ctx.fillRect(240 + (+v[i] + p.x - 0.5) * size, 180 - (+v[i+1] + p.y + 0.5) * size, size, size);
    }
  }
}

// two list files, one item per line: each part's string, and each part's x then y
function saveText(text, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
  a.download = name; a.click();
}
$('list').onclick = () => {
  saveText(parts.map(p => p.str).join('\n'), 'image.gemi.list.txt');
  setTimeout(() => saveText(parts.map(p => `${p.x}\n${p.y}`).join('\n'), 'image.gemi.xy.txt'), 300);
};
$('save').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([parts.map((p, n) => `Part ${n + 1}  x: ${p.x}  y: ${p.y}\n${p.str}\n`).join('\n')], { type: 'text/plain' }));
  a.download = 'image.gemi.txt'; a.click();
};
</script>
</body>
</html>
